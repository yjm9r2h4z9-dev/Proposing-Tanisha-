<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Tanisha ❤️</title>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#ff9a9e,#fecfef);

    font-family:Arial,sans-serif;

    overflow:hidden;

}

.container{

    text-align:center;

}

h1{

    color:white;

    font-size:2.2rem;

    padding:20px;

}

button{

    padding:12px 25px;

    font-size:20px;

    border:none;

    border-radius:30px;

    cursor:pointer;

    margin:10px;

}

#yes{

    background:#28a745;

    color:white;

}

#no{

    background:#dc3545;

    color:white;

    position:absolute;

}

#lovePage{

    display:none;

    text-align:center;

    color:white;

}

#lovePage h1{

    font-size:3rem;

}

#lovePage p{

    font-size:1.5rem;

}

</style>

</head>

<body>

<div id="questionPage" class="container">

    <h1>Tanisha ❤️<br>Will You Be My Girlfriend?</h1>

    <button id="yes">Yes ❤️</button>

    <button id="no">No 😜</button>

</div>

<div id="lovePage">

    <h1>❤️ Tanu ❤️</h1>

    <p>You are so precious to me.</p>

    <p>Thank you for being special in my life ✨</p>

</div>

<script>

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function() {

    const x = Math.random() * (window.innerWidth - 120);

    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";

    noBtn.style.top = y + "px";

});

document.getElementById("yes").addEventListener("click", function() {

    document.getElementById("questionPage").style.display = "none";

    document.getElementById("lovePage").style.display = "block";

    document.body.style.background =

    "linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5)";

});

</script>

</body>

</html>
